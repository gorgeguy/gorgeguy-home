<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Commits on GitHub — 2025–2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #222;
    display: flex;
    flex-direction: column;
    padding: 28px 36px 16px;
  }
  h1 { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: #999; margin-bottom: 16px; }
  .chart-wrapper {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  .chart-wrapper canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }
  .footer {
    font-size: 10px;
    color: #bbb;
    padding-top: 10px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<h1>Claude Code Commits on GitHub</h1>
<p class="subtitle">Monthly commits containing "Co-Authored-By: Claude" — Jan 2025 to Mar 2026</p>
<div class="chart-wrapper">
  <canvas id="chart"></canvas>
</div>
<p class="footer">
  Source: GitHub Search API. Mar 2026 is partial (25 days). Counts are directional estimates — GitHub reports incomplete_results on large queries.
</p>
<script>
Chart.register(ChartDataLabels);

const months = [
  'Jan 25','Feb 25','Mar 25','Apr 25','May 25','Jun 25',
  'Jul 25','Aug 25','Sep 25','Oct 25','Nov 25','Dec 25',
  'Jan 26','Feb 26','Mar 26'
];

const commits = [
  165, 2216, 18907, 16725, 42039, 261067,
  473555, 607580, 564485, 995134, 1155269, 1548108,
  3193421, 5274544, 7899397
];

function formatNum(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(0) + 'K';
  return v.toString();
}

const barColors = commits.map((_, i) => {
  if (i <= 4) return '#94b8d9';
  if (i <= 11) return '#4a90c4';
  return '#e8913a';
});

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: months,
    datasets: [{
      data: commits,
      backgroundColor: barColors,
      borderRadius: 4,
      barPercentage: 0.72
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 24, right: 8 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => ctx.parsed.y.toLocaleString() + ' commits'
        }
      },
      datalabels: {
        anchor: 'end',
        align: 'top',
        color: '#666',
        font: { size: 11, weight: 600 },
        formatter: v => formatNum(v)
      }
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: { color: '#666', font: { size: 12 } },
        border: { color: '#ddd' }
      },
      y: {
        grid: { color: '#f0f0f0' },
        ticks: {
          color: '#999',
          font: { size: 11 },
          callback: v => formatNum(v)
        },
        border: { display: false }
      }
    }
  }
});
</script>
</body>
</html>
