<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jon Richards</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a1628;
            font-family: 'DM Sans', system-ui, sans-serif;
            color: #94a3b8;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Radial gradient background matching homepage hero */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(30, 86, 160, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(45, 212, 191, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 50% 120%, rgba(30, 86, 160, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Noise texture overlay matching homepage */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        .card {
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(45, 212, 191, 0.2);
            box-shadow: 0 0 0 8px rgba(45, 212, 191, 0.04), 0 20px 60px rgba(0, 0, 0, 0.4);
            margin-bottom: 1.25rem;
        }

        .name {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
        }

        .company {
            font-size: 0.95rem;
            font-weight: 500;
            color: #2dd4bf;
            margin-bottom: 1.5rem;
        }

        #qr-code {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            margin: 0 auto 1.5rem;
            display: block;
            width: fit-content;
            max-width: 100%;
            box-shadow:
                0 0 0 1px rgba(45, 212, 191, 0.12),
                0 0 30px rgba(45, 212, 191, 0.06),
                0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #qr-code img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .hint {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #2dd4bf;
        }

        /* Desktop: restore card container */
        @media (min-width: 640px) {
            body {
                padding: 2rem;
            }

            .card {
                background: rgba(15, 32, 56, 0.6);
                border: 1px solid rgba(45, 212, 191, 0.12);
                border-radius: 16px;
                padding: 3rem 2.5rem;
                max-width: 420px;
            }

            #qr-code {
                padding: 16px;
            }

            .company {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="datacenter-calm.png" alt="Jon Richards" class="avatar">
        <p class="name">Jon Richards</p>
        <p class="company">GorgeGuy Solutions</p>
        <div id="qr-code"></div>
        <p class="hint">Scan to add contact</p>
        <a href="index.html" class="back-link">&larr; gorgeguy.com</a>
    </div>

    <script>
        var vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'N:Richards;Jon;;;',
            'FN:Jon Richards',
            'ORG:GorgeGuy Solutions',
            'EMAIL;TYPE=WORK:jon@gorgeguy.com',
            'URL:https://gorgeguy.com',
            'END:VCARD'
        ].join('\n');

        var qr = qrcode(0, 'M');
        qr.addData(vcard);
        qr.make();

        document.getElementById('qr-code').innerHTML = qr.createImgTag(8, 0);
    </script>
</body>
</html>
