<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jon Richards</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e0e0;
            padding: 2rem;
        }

        .card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .company {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 2rem;
        }

        #qr-code {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            margin: 0 auto 2rem;
            display: block;
            width: fit-content;
            max-width: 100%;
        }

        #qr-code img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .hint {
            font-size: 0.85rem;
            color: #666;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #555;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="name">Jon Richards</p>
        <p class="company">GorgeGuy Solutions</p>
        <div id="qr-code"></div>
        <p class="hint">Scan to add contact</p>
        <a href="index.html" class="back-link">&larr; gorgeguy.com</a>
    </div>

    <script>
        var vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'N:Richards;Jon;;;',
            'FN:Jon Richards',
            'ORG:GorgeGuy Solutions',
            'EMAIL;TYPE=WORK:jon@gorgeguy.com',
            'URL:https://gorgeguy.com',
            'END:VCARD'
        ].join('\n');

        var qr = qrcode(0, 'M');
        qr.addData(vcard);
        qr.make();

        document.getElementById('qr-code').innerHTML = qr.createImgTag(6, 0);
    </script>
</body>
</html>
